name: retrain

# YOUR CODE (gap 1): run when a pull request adds or changes files under labs/week10-testing-ci/data/incoming/,
# and also allow a manual run (`workflow_dispatch:`).
on:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/week10-testing-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/week10-testing-ci/requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt
      # YOUR CODE (gap 2): a step named "Data tests on the new file" that runs ONLY tests/test_data.py
      #   (if it fails, the steps after it must not run: that is the default behaviour)
      - name: Retrain and compare with the champion
        run: python -m src.retrain
      - name: Keep the challenger model (only exists if it was promoted)
        uses: actions/upload-artifact@v4
        with:
          name: challenger-model
          path: labs/week10-testing-ci/models/challenger.joblib
          if-no-files-found: ignore
